<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Flower For You ✨</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050508;
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(244, 63, 94, 0.15) 0%, rgba(15, 10, 25, 0.8) 50%, #050508 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }

    /* Ambient Light Aura behind flower */
    .glow-aura {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.35) 0%, rgba(236, 72, 153, 0.15) 40%, transparent 70%);
      border-radius: 50%;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: expandAura 2s 4.5s ease-out forwards;
      pointer-events: none;
      filter: blur(20px);
    }

    @keyframes expandAura {
      to {
        transform: translate(-50%, -50%) scale(1.6);
      }
    }

    /* Canvas for floating sparkles */
    #sparkleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Main Container */
    .flower-container {
      position: relative;
      width: 300px;
      height: 480px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
    }

    /* STEM Animation */
    .stem {
      position: absolute;
      bottom: 60px;
      width: 8px;
      height: 0;
      background: linear-gradient(to top, #15803d, #22c55e, #4ade80);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
      animation: growStem 2.5s ease-in-out forwards;
      transform-origin: bottom center;
    }

    @keyframes growStem {
      0% {
        height: 0px;
      }
      100% {
        height: 250px;
      }
    }

    /* LEAVES */
    .leaf {
      position: absolute;
      width: 50px;
      height: 26px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-radius: 0px 50px 0px 50px;
      box-shadow: 0 0 12px rgba(22, 163, 74, 0.3);
      opacity: 0;
      transform-origin: bottom left;
    }

    .leaf-1 {
      bottom: 120px;
      left: 50%;
      transform: rotate(-10deg) scale(0);
      animation: unfoldLeafLeft 1.2s 1.8s ease-out forwards;
    }

    .leaf-2 {
      bottom: 170px;
      right: 50%;
      border-radius: 50px 0px 50px 0px;
      transform-origin: bottom right;
      transform: rotate(10deg) scale(0);
      animation: unfoldLeafRight 1.2s 2.3s ease-out forwards;
    }

    @keyframes unfoldLeafLeft {
      to {
        opacity: 1;
        transform: rotate(-25deg) scale(1);
      }
    }

    @keyframes unfoldLeafRight {
      to {
        opacity: 1;
        transform: rotate(25deg) scale(1);
      }
    }

    /* FLOWER HEAD & PETALS */
    .flower-head {
      position: absolute;
      bottom: 300px;
      width: 0;
      height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    /* Base Petal Styles */
    .petal {
      position: absolute;
      background: linear-gradient(to top, #be123c, #fb7185, #fda4af);
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.4);
      transform-origin: bottom center;
      opacity: 0;
    }

    /* Outer Layer Petals (8 petals) */
    .petal-outer {
      width: 42px;
      height: 75px;
      bottom: 0;
      animation: bloomOuter 1.5s 3.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Middle Layer Petals (6 petals) */
    .petal-mid {
      width: 34px;
      height: 60px;
      bottom: 0;
      background: linear-gradient(to top, #e11d48, #f43f5e, #fecdd3);
      animation: bloomMid 1.5s 3.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Inner Layer Petals (5 petals) */
    .petal-inner {
      width: 26px;
      height: 45px;
      bottom: 0;
      background: linear-gradient(to top, #9f1239, #f43f5e, #ffe4e6);
      animation: bloomInner 1.5s 4.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Flower Center Bulb */
    .flower-center {
      position: absolute;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #fde047 0%, #ca8a04 70%, #854d0e 100%);
      border-radius: 50%;
      box-shadow: 0 0 20px #fde047, 0 0 40px #facc15;
      opacity: 0;
      transform: scale(0);
      z-index: 10;
      animation: popCenter 1s 4.6s ease-out forwards;
    }

    @keyframes bloomOuter {
      0% {
        opacity: 0;
        transform: rotate(var(--angle)) scale(0) translateY(0);
      }
      100% {
        opacity: 0.95;
        transform: rotate(var(--angle)) scale(1) translateY(-28px);
      }
    }

    @keyframes bloomMid {
      0% {
        opacity: 0;
        transform: rotate(var(--angle)) scale(0) translateY(0);
      }
      100% {
        opacity: 0.95;
        transform: rotate(var(--angle)) scale(1) translateY(-18px);
      }
    }

    @keyframes bloomInner {
      0% {
        opacity: 0;
        transform: rotate(var(--angle)) scale(0) translateY(0);
      }
      100% {
        opacity: 1;
        transform: rotate(var(--angle)) scale(1) translateY(-8px);
      }
    }

    @keyframes popCenter {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Romantic Handwritten Message */
    .romantic-message {
      position: absolute;
      bottom: 40px;
      text-align: center;
      color: #fecdd3;
      z-index: 10;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInMessage 2s 5.2s ease-out forwards;
    }

    .romantic-message h1 {
      font-family: 'Sacramento', cursive;
      font-size: 3.8rem;
      font-weight: 400;
      color: #fda4af;
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.6), 0 0 25px rgba(244, 63, 94, 0.4);
      line-height: 1.1;
    }

    .romantic-message p {
      font-size: 0.85rem;
      color: #cbd5e1;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 5px;
      opacity: 0.8;
    }

    @keyframes fadeInMessage {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Replay Button */
    .replay-btn {
      position: absolute;
      top: 25px;
      right: 25px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fde68a;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      z-index: 20;
    }

    .replay-btn:hover {
      background: rgba(244, 63, 94, 0.3);
      border-color: #fda4af;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Ambient Light Backdrop -->
  <div class="glow-aura"></div>

  <!-- Sparkle Canvas -->
  <canvas id="sparkleCanvas"></canvas>

  <!-- Replay Button -->
  <button class="replay-btn" onclick="replayAnimation()">✨ Bloom Again</button>

  <!-- Flower Container -->
  <div class="flower-container" id="flowerContainer">
    <!-- Green Stem -->
    <div class="stem"></div>

    <!-- Stem Leaves -->
    <div class="leaf leaf-1"></div>
    <div class="leaf leaf-2"></div>

    <!-- Blooming Head -->
    <div class="flower-head">
      <!-- Outer Petals (8) -->
      <div class="petal petal-outer" style="--angle: 0deg;"></div>
      <div class="petal petal-outer" style="--angle: 45deg;"></div>
      <div class="petal petal-outer" style="--angle: 90deg;"></div>
      <div class="petal petal-outer" style="--angle: 135deg;"></div>
      <div class="petal petal-outer" style="--angle: 180deg;"></div>
      <div class="petal petal-outer" style="--angle: 225deg;"></div>
      <div class="petal petal-outer" style="--angle: 270deg;"></div>
      <div class="petal petal-outer" style="--angle: 315deg;"></div>

      <!-- Mid Petals (6) -->
      <div class="petal petal-mid" style="--angle: 22.5deg;"></div>
      <div class="petal petal-mid" style="--angle: 82.5deg;"></div>
      <div class="petal petal-mid" style="--angle: 142.5deg;"></div>
      <div class="petal petal-mid" style="--angle: 202.5deg;"></div>
      <div class="petal petal-mid" style="--angle: 262.5deg;"></div>
      <div class="petal petal-mid" style="--angle: 322.5deg;"></div>

      <!-- Inner Petals (5) -->
      <div class="petal petal-inner" style="--angle: 0deg;"></div>
      <div class="petal petal-inner" style="--angle: 72deg;"></div>
      <div class="petal petal-inner" style="--angle: 144deg;"></div>
      <div class="petal petal-inner" style="--angle: 216deg;"></div>
      <div class="petal petal-inner" style="--angle: 288deg;"></div>

      <!-- Center Bulb -->
      <div class="flower-center"></div>
    </div>
  </div>

  <!-- Romantic Note -->
  <div class="romantic-message">
    <h1>For Estelle ✨</h1>
    <p>A flower that never fades</p>
  </div>

  <script>
    // Canvas Floating Sparkles
    const canvas = document.getElementById('sparkleCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.8 + 0.2;
        this.color = ['#fda4af', '#f43f5e', '#fde047', '#ffffff'][Math.floor(Math.random() * 4)];
      }

      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) {
          this.reset();
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    // Replay Functionality
    function replayAnimation() {
      const container = document.getElementById('flowerContainer');
      const message = document.querySelector('.romantic-message');
      const aura = document.querySelector('.glow-aura');

      // Clone & replace elements to restart keyframe animations cleanly
      const newContainer = container.cloneNode(true);
      const newMessage = message.cloneNode(true);
      const newAura = aura.cloneNode(true);

      container.parentNode.replaceChild(newContainer, container);
      message.parentNode.replaceChild(newMessage, message);
      aura.parentNode.replaceChild(newAura, aura);
    }
  </script>
</body>
</html>
